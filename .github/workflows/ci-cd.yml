name: CloudLedger CI/CD & DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  test-and-build-check:
    name: 1. Pytest Suite & Frontend Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Isolated Pytest Suite
        working-directory: ./backend
        run: pytest -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build React Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

  docker-trivy-and-publish:
    name: 2. Build Images, Trivy CVE Scan & Push to GHCR
    needs: test-and-build-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize Lowercase Owner Name for GHCR
        id: owner
        run: |
          echo "repo_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build Backend Docker Image with Git SHA Tag
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ steps.owner.outputs.repo_owner }}/cloudledger-backend:${{ github.sha }} ./backend

      - name: Build Frontend Docker Image with Git SHA Tag
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ steps.owner.outputs.repo_owner }}/cloudledger-frontend:${{ github.sha }} ./frontend

      - name: Run Trivy Vulnerability Scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.repo_owner }}/cloudledger-backend:${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Run Trivy Vulnerability Scanner on Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.repo_owner }}/cloudledger-frontend:${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Backend & Frontend SHA-Tagged Images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.REGISTRY }}/${{ steps.owner.outputs.repo_owner }}/cloudledger-backend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ steps.owner.outputs.repo_owner }}/cloudledger-frontend:${{ github.sha }}
