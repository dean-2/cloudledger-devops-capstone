apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudledger-broken-worker
  namespace: cloudledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudledger-broken-worker
  template:
    metadata:
      labels:
        app: cloudledger-broken-worker
    spec:
      containers:
      - name: worker
        image: ghcr.io/dean-2/cloudledger-backend:non-existent-broken-tag-999
        imagePullPolicy: Always
        command: ["sh", "-c", "echo 'Worker started successfully'; sleep 3600"]
