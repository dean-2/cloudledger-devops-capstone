services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudledger_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cloudledger_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudledger} -d ${POSTGRES_DB:-cloudledger_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudledger-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudledger-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudledger}:${POSTGRES_PASSWORD:-cloudledger_secret}@postgres:5432/${POSTGRES_DB:-cloudledger_db}
      ENVIRONMENT: development
      DEFAULT_REGION: ap-south-1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudledger-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudledger-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cloudledger-net

volumes:
  pgdata:

networks:
  cloudledger-net:
    driver: bridge