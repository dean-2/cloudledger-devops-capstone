apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudledger-postgres-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudledger-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: cloudledger-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudledger-postgres
  template:
    metadata:
      labels:
        app: cloudledger-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: {{ .Values.postgres.servicePort }}
          envFrom:
            - configMapRef:
                name: cloudledger-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudledger-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U {{ .Values.postgres.username }} -d {{ .Values.postgres.database }}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: cloudledger-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cloudledger-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: cloudledger-postgres
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.servicePort }}
      targetPort: {{ .Values.postgres.servicePort }}
      protocol: TCP
      name: postgres
  selector:
    app: cloudledger-postgres