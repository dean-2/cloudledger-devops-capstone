apiVersion: v1
kind: Secret
metadata:
  name: cloudledger-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@cloudledger-postgres:{{ .Values.postgres.servicePort }}/{{ .Values.postgres.database }}"