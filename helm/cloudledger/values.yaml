namespace: cloudledger

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/dean-2/cloudledger-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/dean-2/cloudledger-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  enabled: true
  image: postgres:15-alpine
  database: cloudledger_db
  username: cloudledger
  password: cloudledger_secret
  storage: 2Gi
  servicePort: 5432

ingress:
  enabled: true
  className: nginx
  host: ""

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70